name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: quran_frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # --- Download sidecar data files from S3 ---
      - name: Download backend data from S3
        run: |
          aws s3 cp s3://qurantrack.hamzas.world/ci-data/quran.db quran_backend/quran.db
          aws s3 cp s3://qurantrack.hamzas.world/ci-data/qpc-v2.db quran_backend/qpc-v2.db
          aws s3 cp s3://qurantrack.hamzas.world/ci-data/qpc-v2-15-lines.db quran_backend/qpc-v2-15-lines.db

      - name: Write backend .env
        shell: bash
        run: |
          cat > quran_backend/.env << 'ENVEOF'
          ${{ secrets.BACKEND_ENV }}
          ENVEOF

      # --- Build Python sidecar ---
      - name: Install Python dependencies
        run: |
          cd quran_backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build sidecar exe
        run: |
          cd quran_backend
          pyinstaller QuranTrackBackend.spec

      - name: Copy sidecar to src-tauri
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $source = "$workspace\quran_backend\dist\QuranTrackBackend.exe"
          $dest = "$workspace\quran_frontend\src-tauri\quran-backend-x86_64-pc-windows-msvc.exe"

          Write-Host "Source: $source"
          Write-Host "Source exists: $(Test-Path $source)"
          if (Test-Path $source) {
            Write-Host "Source size: $((Get-Item $source).Length) bytes"
          }

          Copy-Item $source $dest -Force
          Write-Host "Dest: $dest"
          Write-Host "Dest exists: $(Test-Path $dest)"
          if (Test-Path $dest) {
            Write-Host "Dest size: $((Get-Item $dest).Length) bytes"
          }

      # --- Build Tauri ---
      - name: Write frontend .env
        shell: bash
        run: |
          cat > quran_frontend/.env << 'ENVEOF'
          VITE_SUPABASE_URL=https://qwfnbkkegbhwxxjvyhzl.supabase.co
          VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3Zm5ia2tlZ2Jod3h4anZ5aHpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg4MTUyNTcsImV4cCI6MjA4NDM5MTI1N30.Cjl0l5IteO9mpTQ_GV8cfYsd_fEAYOgpSt0LJJQ1jfE
          ENVEOF

      - name: Install frontend dependencies
        run: |
          cd quran_frontend
          npm ci

      - name: Verify sidecar before build
        shell: pwsh
        run: |
          $binary = "$env:GITHUB_WORKSPACE\quran_frontend\src-tauri\quran-backend-x86_64-pc-windows-msvc.exe"
          Write-Host "=== PRE-BUILD VERIFICATION ==="
          Write-Host "Expected path: $binary"
          Write-Host "File exists: $(Test-Path $binary)"
          if (Test-Path $binary) {
            Write-Host "File size: $((Get-Item $binary).Length) bytes"
          } else {
            Write-Host "ERROR: Binary not found!"
            exit 1
          }

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd quran_frontend
          npx tauri build

      # --- Prepare release artifacts ---
      - name: Read signature and version
        id: sig
        shell: bash
        run: |
          SIG=$(cat quran_frontend/src-tauri/target/release/bundle/nsis/*.exe.sig)
          echo "signature=$SIG" >> "$GITHUB_OUTPUT"
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate latest.json
        shell: bash
        run: |
          cat > quran_frontend/src-tauri/target/release/bundle/nsis/latest.json <<EOF
          {
            "version": "${{ steps.sig.outputs.version }}",
            "notes": "Release ${{ steps.sig.outputs.tag }}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "${{ steps.sig.outputs.signature }}",
                "url": "https://github.com/Hamz115/Quran_App/releases/download/${{ steps.sig.outputs.tag }}/QuranTrack_${{ steps.sig.outputs.version }}_x64-setup.exe"
              }
            }
          }
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.sig.outputs.tag }}"
          body: |
            ## QuranTrack ${{ steps.sig.outputs.tag }}

            **Windows:** Download `QuranTrack_${{ steps.sig.outputs.version }}_x64-setup.exe` below and run it.

            Existing users on v1.3.0+ will be prompted to update automatically.
          files: |
            quran_frontend/src-tauri/target/release/bundle/nsis/QuranTrack_${{ steps.sig.outputs.version }}_x64-setup.exe
            quran_frontend/src-tauri/target/release/bundle/nsis/QuranTrack_${{ steps.sig.outputs.version }}_x64-setup.exe.sig
            quran_frontend/src-tauri/target/release/bundle/nsis/latest.json
