name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: quran_frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # --- Download sidecar data files from S3 ---
      - name: Download backend data from S3
        run: |
          aws s3 cp s3://qurantrack.hamzas.world/ci-data/quran.db quran_backend/quran.db
          aws s3 cp s3://qurantrack.hamzas.world/ci-data/qpc-v2.db quran_backend/qpc-v2.db
          aws s3 cp s3://qurantrack.hamzas.world/ci-data/qpc-v2-15-lines.db quran_backend/qpc-v2-15-lines.db

      - name: Write backend .env
        shell: bash
        run: |
          cat > quran_backend/.env << 'ENVEOF'
          ${{ secrets.BACKEND_ENV }}
          ENVEOF

      # --- Build Python sidecar ---
      - name: Install Python dependencies
        run: |
          cd quran_backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build sidecar exe
        run: |
          cd quran_backend
          pyinstaller QuranTrackBackend.spec

      - name: Copy sidecar to Tauri binaries
        shell: pwsh
        run: |
          $binDir = Join-Path $env:GITHUB_WORKSPACE "quran_frontend" "src-tauri" "binaries"
          $source = Join-Path $env:GITHUB_WORKSPACE "quran_backend" "dist" "QuranTrackBackend.exe"
          $dest = Join-Path $binDir "quran-backend-x86_64-pc-windows-msvc.exe"

          Write-Host "Source: $source"
          Write-Host "Source exists: $(Test-Path $source)"

          if (-not (Test-Path $binDir)) {
            New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          }

          Copy-Item $source $dest -Force
          Write-Host "Dest: $dest"
          Write-Host "Dest exists: $(Test-Path $dest)"
          Write-Host "Dest size: $((Get-Item $dest).Length) bytes"
          Write-Host "Directory listing:"
          Get-ChildItem $binDir

      - name: Install frontend dependencies
        run: |
          cd quran_frontend
          npm ci

      # --- Build Tauri using official action ---
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: quran_frontend
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: '${{ github.ref_name }}'
          releaseBody: |
            ## QuranTrack ${{ github.ref_name }}

            **Windows:** Download the `.exe` installer below and run it.

            Existing users on v1.3.0+ will be prompted to update automatically.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
