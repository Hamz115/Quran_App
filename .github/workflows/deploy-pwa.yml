name: Deploy QuranTrack PWA

on:
  push:
    branches: [main]
    paths:
      - 'quran_frontend/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

concurrency:
  group: qurantrack-pwa-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      EXPECTED_AWS_ACCOUNT: '637282979276'
      S3_BUCKET: qurantrack-app-637282979276
      CLOUDFRONT_DISTRIBUTION_ID: ELF0U79EJW574

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quran_frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: quran_frontend
        run: npm ci

      - name: Build production PWA
        working-directory: quran_frontend
        run: npm run build

      - name: Configure Hamza AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify approved AWS account
        shell: bash
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$account" != "$EXPECTED_AWS_ACCOUNT" ]]; then
            echo "Refusing deployment: credentials resolved to unexpected AWS account $account" >&2
            exit 1
          fi

      - name: Upload immutable application assets
        run: |
          aws s3 sync quran_frontend/dist/ "s3://$S3_BUCKET/" \
            --delete \
            --region "$AWS_REGION" \
            --cache-control 'public,max-age=31536000,immutable' \
            --only-show-errors

      - name: Upload mutable entry files without caching
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp quran_frontend/dist/index.html "s3://$S3_BUCKET/index.html" \
            --region "$AWS_REGION" --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8' --metadata-directive REPLACE --only-show-errors
          aws s3 cp quran_frontend/dist/sw.js "s3://$S3_BUCKET/sw.js" \
            --region "$AWS_REGION" --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'application/javascript; charset=utf-8' --metadata-directive REPLACE --only-show-errors
          aws s3 cp quran_frontend/dist/manifest.webmanifest "s3://$S3_BUCKET/manifest.webmanifest" \
            --region "$AWS_REGION" --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'application/manifest+json' --metadata-directive REPLACE --only-show-errors

      - name: Invalidate CloudFront entry points
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/' '/index.html' '/sw.js' '/manifest.webmanifest'
